# Android PoC — ساخت Debug APK برای تست Capacitor روی گوشی واقعی
# -----------------------------------------------------------------
# این workflow کاملاً جدا از reminder-cron.yml است و هیچ ارتباطی با آن ندارد.
#
# پیش‌نیاز (یک‌بار در GitHub → Settings → Secrets and variables → Actions → Variables):
#   - CAPACITOR_SERVER_URL : آدرس واقعی production سایت (مثلاً https://your-domain)
#     عمداً از `vars` خوانده می‌شود نه `secrets`، چون یک آدرس عمومی است نه راز.
#     هیچ URL ای داخل این فایل hardcode نشده است.
#
# اجرا فقط دستی است (workflow_dispatch) — هیچ trigger خودکار/push/schedule ندارد.
# خروجی فقط Debug APK است: بدون release signing و بدون keystore.
#
# درباره‌ی «non-interactive» بودن (رفع خطای «SDK package licenses not accepted»):
#   action رسمی `android-actions/setup-android` برای پذیرش مجوز فقط ۱۰ بار «y» به
#   stdin می‌نویسد؛ اگر تعداد promptها بیشتر باشد ورودی تمام می‌شود و sdkmanager
#   روی «Accept? (y/N)» منتظر می‌ماند (همان چیزی که build را در CI هنگ می‌کند).
#   بنابراین در این workflow:
#     ۱) پذیرش مجوز خودِ action خاموش است (accept-android-sdk-licenses: false)
#     ۲) پذیرش مجوز با `yes | sdkmanager --licenses` (بی‌نهایت y) انجام می‌شود
#     ۳) فقط همان SDKهای لازم برای همین پروژه صریحاً نصب می‌شوند
#   هیچ Google TV / Android XR / emulator / system-image نصب نمی‌شود.

name: android-poc

on:
  workflow_dispatch: {}

# فقط خواندن محتوا لازم است؛ artifact آپلود با permission پیش‌فرض actions کار می‌کند.
permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Capacitor debug APK
    runs-on: ubuntu-latest

    env:
      # از خود پروژه استخراج شده: android/variables.gradle و android/build.gradle
      #   compileSdk = 36 · targetSdk = 36 · minSdk = 24 · AGP = 8.13.0
      # build-tools متناظر AGP 8.13 برای compileSdk 36 همان 36.0.0 است.
      ANDROID_PLATFORM: "platforms;android-36"
      ANDROID_BUILD_TOOLS: "build-tools;36.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # cmdline-tools را نصب می‌کند، ولی هیچ package اضافه‌ای نصب نمی‌کند و
      # پذیرش مجوزش هم عمداً خاموش است (مرحله‌ی بعد جایش را می‌گیرد).
      - name: Setup Android SDK (command-line tools only)
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false

      # بی‌نهایت «y» → هیچ‌وقت روی prompt متوقف نمی‌شود.
      - name: Accept Android SDK licenses (non-interactive)
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "platform-tools"
          # تأیید صریح نصب — اگر چیزی نصب نشده باشد، build با پیام واضح‌تر اینجا رد می‌شود.
          sdkmanager --list_installed

      - name: Install dependencies
        run: npm ci

      - name: Validate CAPACITOR_SERVER_URL
        env:
          CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
        run: |
          set -euo pipefail
          value="${CAPACITOR_SERVER_URL:-}"
          if [ -z "$value" ]; then
            echo "::error::CAPACITOR_SERVER_URL is not set. Add it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ "$value" = "https://example.invalid" ]; then
            echo "::error::CAPACITOR_SERVER_URL is still the placeholder 'https://example.invalid'. Set it to the real production URL."
            exit 1
          fi
          if ! printf '%s' "$value" | grep -Eq '^https://[^[:space:]]+$'; then
            echo "::error::CAPACITOR_SERVER_URL must be a valid https:// URL with no whitespace."
            exit 1
          fi
          echo "CAPACITOR_SERVER_URL is valid."

      - name: Capacitor sync (android)
        env:
          CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-poc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
