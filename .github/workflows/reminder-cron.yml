# Reminder Cron — جایگزین Vercel Cron روی پلن Hobby
# ---------------------------------------------------------------
# Vercel Hobby فقط cron روزانه مجاز است؛ این workflow هر ۱۰ دقیقه
# تریگر یادآورها را روی دامنهی production صدا میزند.
#
# نیازمندی‌ها (GitHub → Settings → Secrets and variables → Actions):
#   Secret‌ها:
#     - CRON_SECRET : همان مقدار CRON_SECRET در Vercel Environment Variables
#     - PROD_URL    : دامنهی production (مثلاً https://daily-pilot.vercel.app) بدون / انتهایی
#
# مسیر هدف همیشه /api/cron/reminders است. احراز هویت فقط با
# Authorization: Bearer <CRON_SECRET> انجام میشود (هدر x-vercel-cron
# عمداً کافی نیست — در کد route مسدود شده است).
#
# نکتههای GitHub Actions:
#   - schedule فقط روی شاخهی پیشفرض (main) اجرا میشود.
#   - زمانبندی UTC است؛ هر کاربر بر اساس timezone خودش و پنجرهی
#     سررسید ۱۵ دقیقه‌ای سمت سرور بررسی میشود، پس جابجایی دقیق اجرا
#     (که در GitHub معمول است) مشکلساز نیست.
#   - GitHub بعد از ~۶۰ روز بیفعالیتی repo، schedule را خودکار
#     غیرفعال میکند؛ یک push ساده آن را دوباره فعال میکند.

name: reminder-cron

on:
  schedule:
    - cron: "*/10 * * * *"   # هر ۱۰ دقیقه (UTC)
  workflow_dispatch: {}       # اجرای دستی از تب Actions

# همزمان بیشتر از یک اجرا لازم نیست؛ اجرای جدید صف نمیشود
concurrency:
  group: reminder-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder cron endpoint
        id: ping
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set in GitHub Actions secrets"
            exit 1
          fi

          if [ -z "${PROD_URL}" ] || ! printf '%s' "${PROD_URL}" | grep -Eq '^https://[A-Za-z0-9.-]+'; then
            echo "::error::PROD_URL is not set or invalid (expected https://<your-vercel-domain>, no trailing slash)"
            exit 1
          fi

          base="${PROD_URL%/}"
          endpoint="${base}/api/cron/reminders"
          echo "POST ${endpoint}"

          http_code="$(curl -sS --max-time 30 \
            -o /tmp/cron_response.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${endpoint}")"

          echo "HTTP ${http_code}"
          cat /tmp/cron_response.json || true

          if [ "${http_code}" != "200" ]; then
            echo "::error::reminder cron returned HTTP ${http_code} (expected 200)"
            echo "::error::check the Vercel env CRON_SECRET and the GitHub secret PROD_URL"
            exit 1
          fi
